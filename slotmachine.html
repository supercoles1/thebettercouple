<!DOCTYPE html>
<html lang="en">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎰 Wedding Slot Machine</title>

  <link rel="stylesheet" href="css/style.css" />

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">
    <img src="images/UsLogo.png" alt="Logo">
  </div>
  <nav>
  <a href="index.html">Home</a>
  <a href="history.html">History</a>
  <a href="seating.html">Seating</a>
  <a href="menu.html">Menu</a>
  <a href="games.html">Games</a>
</nav>

</header>

<style>

body{
  margin:0;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  font-family:"Poppins",sans-serif;

  background:linear-gradient(
    135deg,
    #ff4fd8,
    #fff066
  );

  padding:20px;
}

.slot-card{
  width:100%;
  max-width:700px;

  background:rgba(255,255,255,.15);
  backdrop-filter:blur(20px);

  border-radius:30px;

  padding:40px 25px;

  text-align:center;

  box-shadow:
    0 20px 50px rgba(0,0,0,.2);
}

h1{
  margin-top:0;
  color:white;
  font-size:3rem;

  text-shadow:
    0 4px 15px rgba(0,0,0,.2);
}

.subtitle{
  color:white;
  margin-bottom:30px;
}

.slots{
  display:flex;
  justify-content:center;
  gap:20px;

  margin:30px 0;
}

.reel{
  width:110px;
  height:110px;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:4rem;

  background:white;

  border-radius:25px;

  box-shadow:
    0 10px 20px rgba(0,0,0,.15);
}

button{
  border:none;

  padding:15px 35px;

  border-radius:999px;

  font-size:1.1rem;
  font-weight:600;

  cursor:pointer;

  background:#ff1493;
  color:white;

  transition:.3s;
}

button:hover{
  transform:translateY(-3px);
}

#result{
  margin-top:25px;

  min-height:40px;

  font-size:1.2rem;
  font-weight:600;

  color:white;
}

.back-btn{
  display:inline-block;

  margin-top:25px;

  color:white;
  text-decoration:none;

  font-weight:600;
}

@media(max-width:768px){

  h1{
    font-size:2.2rem;
  }

  .reel{
    width:90px;
    height:90px;
    font-size:3rem;
  }

  .slots{
    gap:10px;
  }
}

</style>
</head>

<body>

<div class="slot-card">

  <h1>🎰 Wedding Slot Machine</h1>

  <p class="subtitle">
    Spin to discover your wedding fortune!
  </p>

  <div class="slots">
    <div class="reel" id="r1">💛</div>
    <div class="reel" id="r2">💍</div>
    <div class="reel" id="r3">🏠</div>
  </div>

  <button onclick="spinSlots()">
    SPIN
  </button>

  <div id="result"></div>

  <a href="games.html" class="back-btn">
    ← Back to Games
  </a>

</div>

<script>

const symbols = [
  "❤️",
  "💍",
  "🏠",
  "👶",
  "🎂",
  "🥂"
];

function spinSlots(){

  const reels = [
    document.getElementById("r1"),
    document.getElementById("r2"),
    document.getElementById("r3")
  ];

  document.getElementById("result").innerHTML = "";

  let spins = 0;

  const interval = setInterval(() => {

    reels.forEach(reel => {
      reel.textContent =
      symbols[Math.floor(Math.random()*symbols.length)];
    });

    spins++;

    if(spins > 15){

      clearInterval(interval);

      const a = reels[0].textContent;
      const b = reels[1].textContent;
      const c = reels[2].textContent;

      checkWin(a,b,c);

    }

  },100);
}

function checkWin(a,b,c){

  let message = "Try Again! 🎲";

  if(a===b && b===c){

    switch(a){

      case "💛":
        message="💛 Soulmates Forever!";
        break;

      case "💍":
        message="💍 Wedding Bells Are Ringing!";
        break;

      case "🏠":
        message="🏠 Dream Home Unlocked!";
        break;

      case "👶":
        message="👶 Family Goals!";
        break;

      case "🎂":
        message="🎂 Extra Cake For You!";
        break;

      case "🥂":
        message="🥂 Time To Celebrate!";
        break;
    }
  }

  if(
    (a==="💍" && b==="💛" && c==="🏠") ||
    (a==="🏠" && b==="💛" && c==="💍")
  ){
    message="🎉 BRIA & MAURICE JACKPOT! 🎉";
  }

  document.getElementById("result").innerHTML = message;
}

</script>

</body>
</html>
