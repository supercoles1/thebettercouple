<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🪨📄✂️ Rock Paper Scissors</title>

  <!-- ONLY YOUR TWO CSS FILES -->
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="game-page">

  <!-- NAVBAR -->
  <header class="navbar">

    <a href="index.html" class="logo">
      <img src="images/UsLogo.png" alt="Logo">
    </a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="history.html">History</a>
      <a href="seating.html">Seating</a>
      <a href="menu.html">Menu</a>
      <a href="games.html" class="active">Games</a>
    </nav>

  </header>

  <!-- GAME HEADER -->
  <img src="images/DeuceHulk.png" class="game-logo" alt="Bre">

  <p class="game-quote">
    "Try to guess the number I'm thinking of.
    Good luck... honestly, most of the time I don't even know what I'm thinking myself."
    <br><br>
    - Brelyn
  </p>

  <h1>Guess the Number 💖</h1>

  <!-- SCOREBOARD -->
  <div class="scoreboard">

    <div class="score-box">
      <h3>YOU</h3>
      <span id="playerWins">0</span>
    </div>

    <div class="middle-box">
      💭 MIND READER 💭
    </div>

    <div class="score-box">
      <h3>BRE</h3>
      <span id="breWins">0</span>
    </div>

  </div>

  <!-- GAME AREA -->
  <div class="game-card">

    <div id="status" class="status">
      You have 3 guesses!
    </div>

    <div id="cards"></div>

  </div>

  <!-- END SCREEN -->
  <div class="end-screen" id="endScreen">

    <div class="end-box">

      <div class="end-title" id="endTitle"></div>

      <div class="end-msg" id="endMessage"></div>

      <button onclick="initGame()">
        🔄 Play Again
      </button>

    </div>

  </div>

  <!-- BACK BUTTON -->
  <a href="games.html" class="games-home-btn">
    🎮 Back to Games
  </a>

  <!-- SCRIPT -->
  <script>
    const cardsContainer = document.getElementById("cards");
    const status = document.getElementById("status");

    let numberToGuess;
    let guessesLeft;

    let playerWins = 0;
    let breWins = 0;

    function initGame(){

      cardsContainer.innerHTML = "";
      guessesLeft = 3;

      numberToGuess = Math.floor(Math.random() * 10) + 1;

      status.textContent = `You have ${guessesLeft} guesses!`;

      document.getElementById("endScreen").style.display = "none";

      for(let i = 1; i <= 10; i++){

        const card = document.createElement("div");
        card.classList.add("card");
        card.textContent = i;

        card.addEventListener("click", () => makeGuess(i));

        cardsContainer.appendChild(card);
      }
    }

    function makeGuess(guess){

      if(guessesLeft <= 0) return;

      guessesLeft--;

      if(guess === numberToGuess){

        playerWins++;
        document.getElementById("playerWins").textContent = playerWins;

        endGame(true);

      } else if(guessesLeft > 0){

        status.textContent =
          `Wrong! ${guessesLeft} guess${guessesLeft > 1 ? "es" : ""} left.`;

      } else {

        breWins++;
        document.getElementById("breWins").textContent = breWins;

        endGame(false);
      }
    }

    function endGame(win){

      const endScreen = document.getElementById("endScreen");
      const endTitle = document.getElementById("endTitle");
      const endMessage = document.getElementById("endMessage");

      if(win){
        endTitle.textContent = "😡 REMATCH!";
        endMessage.textContent =
          `You guessed my number! It was ${numberToGuess}.`;
      } else {
        endTitle.textContent = "😂 You're TRASH!";
        endMessage.textContent =
          `My number was ${numberToGuess}.`;
      }

      endScreen.style.display = "flex";
    }

    initGame();
  </script>

</body>
</html>
