<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💞 Love Run</title>

  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/loverun.css">
</head>

<body class="game-page">

  <!-- NAV -->
  <header class="navbar">

    <a href="index.html" class="logo">
      <img src="images/UsLogo.png" alt="Logo">
    </a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="history.html">History</a>
      <a href="seating.html">Seating</a>
      <a href="menu.html">Menu</a>
      <a href="games.html" class="active">Games</a>
    </nav>

  </header>

  <!-- HERO -->
  <section class="game-hero">

    <img
      src="images/LoveRun.png"
      alt="Bria and Maurice"
      class="hero-image"
    >

    <h1>💞 Love Run</h1>

    <p>
      Bria and Maurice are racing to make it to their Celebration Dinner
      before time runs out. Jump over heartbreaks, dodge obstacles,
      and make it to the celebration together.
    </p>

  </section>

  <!-- CHARACTER SELECT -->
  <div id="selectScreen" class="screen">

    <h2>Choose Your Runner</h2>

    <div class="character-grid">

      <div class="character selected"
           id="himCard"
           onclick="choose('him')">

        <img src="images/HimRunner.png" alt="Maurice">

        <h3>Maurice</h3>

      </div>

      <div class="character"
           id="herCard"
           onclick="choose('her')">

        <img src="images/HerRunner.png" alt="Bria">

        <h3>Bria</h3>

      </div>

    </div>

    <button onclick="startGame()">
      START GAME
    </button>

  </div>

  <!-- GAME -->
  <div id="gameScreen" class="screen hidden">

    <div class="score">
      Score:
      <span id="score">0</span>
    </div>

    <canvas
      id="game"
      width="800"
      height="350">
    </canvas>

    <button onclick="jump()">
      JUMP
    </button>

  </div>

  <!-- GAME OVER -->
  <div id="gameOverScreen"
       class="screen hidden">

    <h1>💔 GAME OVER</h1>

    <h2 id="finalScore">
      Score: 0
    </h2>

    <button onclick="playAgain()">
      PLAY AGAIN
    </button>

    <button onclick="changeRunner()">
      CHANGE RUNNER
    </button>

  </div>

  <script src="js/loverun.js"></script>

</body>
</html>
