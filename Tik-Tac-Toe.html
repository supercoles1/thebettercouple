  "Tic-tac-toe? I’ll let you go first… not because I have to, but because it makes the ending more embarrassing for you."
  <br><br>-Bria
</p>

<h1>Tic Tac Toe</h1>

<div id="game"></div>
<div id="status">Your turn (❌)</div>
<button onclick="restartGame()">Restart</button>

<!-- END SCREEN -->
<div class="end-screen" id="endScreen">
  <div class="end-box">
    <div class="end-title" id="endTitle"></div>
    <div class="end-msg" id="endMessage"></div>
    <button onclick="restartGame()">Play Again</button>
  </div>
</div>
</div> <!-- END .game-card -->

<a href="games.html" class="games-home-btn">
  🎮 Back to Games
</a>

<script>
const gameContainer = document.getElementById("game");
const statusText = document.getElementById("status");

const endScreen = document.getElementById("endScreen");
const endTitle = document.getElementById("endTitle");
const endMessage = document.getElementById("endMessage");

let board = ["", "", "", "", "", "", "", "", ""];
let currentPlayer = "❌";
let gameActive = true;

function showEndScreen(title, message) {
  endTitle.textContent = title;
  endMessage.textContent = message;
  endScreen.style.display = "flex";
}

for (let i = 0; i < 9; i++) {
  const cell = document.createElement("div");
  cell.classList.add("cell");
  cell.dataset.index = i;
  cell.addEventListener("click", handleCellClick);
  gameContainer.appendChild(cell);
}

function handleCellClick(e) {
  const index = e.target.dataset.index;

  if (board[index] !== "" || !gameActive) return;

  makeMove(index, "❌");

  if (checkWinner(board, "❌")) {
    gameActive = false;
    showEndScreen("🎉 You Win!", "I wasn't even trying!");
    return;
  }

  if (!board.includes("")) {
    gameActive = false;
    showEndScreen("😐 Draw!", "Nobody wins!");
    return;
  }

  statusText.textContent = "Bria is thinking...";
  setTimeout(cpuMove, 800);
}

function cpuMove() {
  let bestScore = -Infinity;
  let move;

  for (let i = 0; i < 9; i++) {
    if (board[i] === "") {
      board[i] = "💛";
      let score = minimax(board, 0, false, -Infinity, Infinity);
      board[i] = "";

      if (score > bestScore) {
        bestScore = score;
        move = i;
      }
    }
  }

  makeMove(move, "💛");

  if (checkWinner(board, "💛")) {
    gameActive = false;
    showEndScreen("💛 Bria Wins!", "Beauty and Brains 💅");
    return;
  }

  if (!board.includes("")) {
    gameActive = false;
    showEndScreen("😐 Draw!", "Nobody wins!");
    return;
  }

  statusText.textContent = "Your turn (❌)";
}

function makeMove(index, player) {
  board[index] = player;

  const cell = gameContainer.children[index];
  cell.textContent = player;

  if (player === "💛") {
    cell.style.color = "#FFD700";
  } else {
    cell.style.color = "#FFFFFF";
  }
}

function checkWinner(b, p) {
  const winPatterns = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  return winPatterns.some(pattern =>
    pattern.every(i => b[i] === p)
  );
}

function restartGame() {
  board = ["", "", "", "", "", "", "", "", ""];
  gameActive = true;

  statusText.textContent = "Your turn (❌)";

  [...gameContainer.children].forEach(cell => {
    cell.textContent = "";
    cell.style.color = "white";
  });

  endScreen.style.display = "none";
}

function minimax(newBoard, depth, isMaximizing, alpha, beta) {

  if (checkWinner(newBoard, "💛")) return 10 - depth;
  if (checkWinner(newBoard, "❌")) return depth - 10;
  if (!newBoard.includes("")) return 0;

  if (isMaximizing) {
    let best = -Infinity;

    for (let i = 0; i < 9; i++) {
      if (newBoard[i] === "") {
        newBoard[i] = "💛";

        let score = minimax(
          newBoard,
          depth + 1,
          false,
          alpha,
          beta
        );

        newBoard[i] = "";

        best = Math.max(best, score);
        alpha = Math.max(alpha, score);

        if (beta <= alpha) break;
      }
    }

    return best;

  } else {

    let best = Infinity;

    for (let i = 0; i < 9; i++) {
      if (newBoard[i] === "") {
        newBoard[i] = "❌";

        let score = minimax(
          newBoard,
          depth + 1,
          true,
          alpha,
          beta
        );

        newBoard[i] = "";

        best = Math.min(best, score);
        beta = Math.min(beta, score);

        if (beta <= alpha) break;
      }
    }

    return best;
  }
}
</script>

</body>
