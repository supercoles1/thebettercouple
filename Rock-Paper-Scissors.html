<!DOCTYPE html>
<html lang="en">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪨📄✂️</title>

  <link rel="stylesheet" href="css/style.css" />

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">
    <img src="images/UsLogo.png" alt="Logo">
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="seating.html">Seating</a>
    <a href="menu.html">Menu</a>
    <a href="games.html" class="active">Games</a>
  </nav>
</header>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪨📄✂️</title>
<style>
  body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(45deg,#ff43e0,#ffc0cb,#ff80bf);
  background-size: 400% 400%;
  animation: gradientMove 8s ease infinite;
  color: white;
  text-align: center;
  padding-top: 90px;
}

@keyframes gradientMove {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

.game-card{
  width:90%;
  max-width:750px;
  padding:30px;
  border-radius:25px;

  background:rgba(255,255,255,.12);
  backdrop-filter:blur(15px);

  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
  width:180px;
  margin-bottom:10px;
  filter:drop-shadow(0 0 15px rgba(255,255,255,.4));
}

h1{
  margin:10px 0;
  text-shadow:0 0 15px #ff0099;
}

.game-quote{
  max-width:550px;
  margin:auto;
  margin-bottom:20px;
  font-style:italic;
}

.scoreboard{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.score-box{
  background:rgba(255,255,255,.15);
  border-radius:15px;
  padding:15px;
  min-width:120px;
}

.score-box h3{
  margin:0;
  font-size:14px;
}

.score-box span{
  font-size:42px;
  font-weight:bold;
}

.round-box{
  font-size:22px;
  font-weight:bold;
}

.battle-area{
  min-height:160px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.vs{
  font-size:70px;
  margin:10px 0;
}

.choice{
  font-size:80px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
}

.buttons button{
  width:110px;
  height:110px;
  border:none;
  border-radius:20px;
  font-size:50px;
  cursor:pointer;

  background:rgba(255,255,255,.15);
  color:white;

  transition:.25s;
}

.buttons button:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px white;
}

#resetBtn{
  margin-top:20px;
  border:none;
  padding:12px 30px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
}

.winner-banner{
  margin-top:15px;
  font-size:24px;
  font-weight:bold;
  text-shadow:0 0 10px white;
}

.victory-screen{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.75);
  z-index:9999;
}

.victory-box{
  background:white;
  color:#333;
  padding:30px;
  border-radius:20px;
  width:320px;
  text-align:center;
}

.victory-box img{
  width:130px;
}

.victory-box h2{
  color:#ff0099;
}
</style>
</head>
<body>
<div class="game-card">

<div class="scoreboard">

  <div class="score-box">
    <h3>YOU</h3>
    <span id="playerScore">0</span>
  </div>

  <div class="round-box">
    ROUND <span id="roundNum">1</span>/5
  </div>

  <div class="score-box">
    <h3>MAURICE</h3>
    <span id="cpuScore">0</span>
  </div>

</div>

<img src="images/MyFunkoPop.png" alt="Funko" class="logo">

<p class="game-quote">
"Rock, paper, scissors—one on one?
Say less. I’ve already won in my head…
I'm just waiting on you to catch up."
<br><br>
-Maurice
</p>

<h1>🪨 ROCK • PAPER • SCISSORS ✂️</h1>

<div class="battle-area" id="status">
Make your move!
</div>

<div class="buttons">
  <button onclick="playerChoice('rock')">🪨</button>
  <button onclick="playerChoice('paper')">📄</button>
  <button onclick="playerChoice('scissors')">✂️</button>
</div>

<button id="resetBtn" onclick="resetGame()">Reset Game</button>

</div>

<div class="victory-screen" id="victoryScreen">

  <div class="victory-box">

    <img src="images/MyFunkoPop.png">

    <h2 id="winnerTitle">Winner</h2>

    <p id="winnerMessage"></p>

    <button onclick="resetGame()">
      Play Again
    </button>

  </div>

</div>

<script>
const status = document.getElementById("status");

let playerScore = 0;
let aiScore = 0;
let round = 1;

const maxRounds = 5;

function aiChoice(){

  const choices = ['rock','paper','scissors'];

  return choices[
    Math.floor(Math.random()*3)
  ];
}

function disableButtons(state){

  document
    .querySelectorAll(".buttons button")
    .forEach(btn => btn.disabled = state);
}

async function playerChoice(choice){

  if(round > maxRounds) return;

  disableButtons(true);

  const ai = aiChoice();

  status.innerHTML = `
  <h2>🪨</h2>
  `;

  await sleep(500);

  status.innerHTML = `
  <h2>📄</h2>
  `;

  await sleep(500);

  status.innerHTML = `
  <h2>✂️</h2>
  `;

  await sleep(500);

  status.innerHTML = `
  <div class="choice">${emoji(choice)}</div>
  <div class="vs">VS</div>
  <div class="choice">${emoji(ai)}</div>
  `;

  await sleep(600);

  let result="";

  if(choice===ai){

    result="🤝 DRAW";

  } else if(

    (choice==="rock" && ai==="scissors") ||
    (choice==="paper" && ai==="rock") ||
    (choice==="scissors" && ai==="paper")

  ){

    playerScore++;

    result="🎉 YOU WIN THIS ROUND";

  } else {

    aiScore++;

    result="😎 MAURICE WINS THIS ROUND";

  }

  document.getElementById("playerScore")
  .textContent = playerScore;

  document.getElementById("cpuScore")
  .textContent = aiScore;

  status.innerHTML += `
  <div class="winner-banner">
  ${result}
  </div>
  `;

  round++;

  document.getElementById("roundNum")
  .textContent =
  Math.min(round,maxRounds);

  disableButtons(false);

  if(round > maxRounds){

    disableButtons(true);

    setTimeout(showWinner,1000);
  }
}

function showWinner(){

  let title="";
  let msg="";

  if(playerScore > aiScore){

    title="🏆 CHAMPION";

    msg="You defeated Maurice!";

  } else if(aiScore > playerScore){

    title="😎 MAURICE WINS";

    msg="I am H.I.M.";

  } else {

    title="🤝 TIE";

    msg="Nobody wins today.";
  }

  document
  .getElementById("winnerTitle")
  .textContent = title;

  document
  .getElementById("winnerMessage")
  .textContent = msg;

  document
  .getElementById("victoryScreen")
  .style.display = "flex";
}

function emoji(choice){

  if(choice==="rock") return "🪨";

  if(choice==="paper") return "📄";

  return "✂️";
}

function sleep(ms){

  return new Promise(resolve =>
    setTimeout(resolve,ms)
  );
}

function resetGame(){

  playerScore = 0;
  aiScore = 0;
  round = 1;

  document.getElementById("playerScore")
  .textContent = "0";

  document.getElementById("cpuScore")
  .textContent = "0";

  document.getElementById("roundNum")
  .textContent = "1";

  status.innerHTML =
  "Make your move!";

  document.getElementById("victoryScreen")
  .style.display = "none";

  disableButtons(false);
}
</script>

</body>
</html>
