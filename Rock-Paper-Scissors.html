<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🪨📄✂️ Rock Paper Scissors</title>

  <!-- ONLY YOUR TWO CSS FILES -->
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="game-page">

  <!-- NAVBAR -->
  <header class="navbar">

    <a href="index.html" class="logo">
      <img src="images/UsLogo.png" alt="Logo">
    </a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="history.html">History</a>
      <a href="seating.html">Seating</a>
      <a href="menu.html">Menu</a>
      <a href="games.html" class="active">Games</a>
    </nav>

  </header>

  <!-- GAME -->
  <div class="game-card">

    <div class="scoreboard">

      <div class="score-box">
        <h3>YOU</h3>
        <span id="playerScore">0</span>
      </div>

      <div class="round-box">
        ROUND <span id="roundNum">1</span>/5
      </div>

      <div class="score-box">
        <h3>MAURICE</h3>
        <span id="cpuScore">0</span>
      </div>

    </div>

    <img src="images/MyFunkoPop.png" class="game-logo" alt="Maurice">

    <p class="game-quote">
      "Rock, paper, scissors—one on one?
      Say less. I've already won in my head…
      I'm just waiting on you to catch up."
      <br><br>
      -Maurice
    </p>

    <h1>ROCK • PAPER • SCISSORS</h1>

    <div class="battle-area" id="status">
      Make your move!
    </div>

    <div class="buttons">
      <button onclick="playerChoice('rock')">🪨</button>
      <button onclick="playerChoice('paper')">📄</button>
      <button onclick="playerChoice('scissors')">✂️</button>
    </div>

    <button id="resetBtn" onclick="resetGame()">
      Reset Game
    </button>

  </div>

  <!-- VICTORY SCREEN -->
  <div class="victory-screen" id="victoryScreen">

    <div class="victory-box">

      <img src="images/MyFunkoPop.png" alt="Winner">

      <h2 id="winnerTitle">Winner</h2>

      <p id="winnerMessage"></p>

      <button onclick="resetGame()">Play Again</button>

    </div>

  </div>

  <!-- BACK BUTTON -->
  <a href="games.html" class="games-home-btn">
    🎮 Back to Games
  </a>

  <!-- JS -->
  <script>
    const status = document.getElementById("status");

    let playerScore = 0;
    let aiScore = 0;
    let round = 1;
    const maxRounds = 5;

    function aiChoice(){
      const choices = ["rock","paper","scissors"];
      return choices[Math.floor(Math.random()*3)];
    }

    function disableButtons(state){
      document.querySelectorAll(".buttons button")
        .forEach(btn => btn.disabled = state);
    }

    async function playerChoice(choice){

      if(round > maxRounds) return;

      disableButtons(true);

      const ai = aiChoice();

      status.innerHTML = "<h2>🪨</h2>";
      await sleep(400);

      status.innerHTML = "<h2>📄</h2>";
      await sleep(400);

      status.innerHTML = "<h2>✂️</h2>";
      await sleep(400);

      status.innerHTML = `
        <div class="choice">${emoji(choice)}</div>
        <div class="vs">VS</div>
        <div class="choice">${emoji(ai)}</div>
      `;

      await sleep(500);

      let result = "";

      if(choice === ai){
        result = "🤝 DRAW";
      } else if(
        (choice==="rock" && ai==="scissors") ||
        (choice==="paper" && ai==="rock") ||
        (choice==="scissors" && ai==="paper")
      ){
        playerScore++;
        result = "🎉 YOU WIN THIS ROUND";
      } else {
        aiScore++;
        result = "😎 MAURICE WINS THIS ROUND";
      }

      document.getElementById("playerScore").textContent = playerScore;
      document.getElementById("cpuScore").textContent = aiScore;

      status.innerHTML += `<div class="winner-banner">${result}</div>`;

      round++;
      document.getElementById("roundNum").textContent = Math.min(round,maxRounds);

      disableButtons(false);

      if(round > maxRounds){
        disableButtons(true);
        setTimeout(showWinner,800);
      }
    }

    function showWinner(){

      let title="", msg="";

      if(playerScore > aiScore){
        title="🏆 CHAMPION";
        msg="You defeated Maurice!";
      } else if(aiScore > playerScore){
        title="😎 MAURICE WINS";
        msg="I am H.I.M.";
      } else {
        title="🤝 TIE";
        msg="Nobody wins today.";
      }

      document.getElementById("winnerTitle").textContent = title;
      document.getElementById("winnerMessage").textContent = msg;

      document.getElementById("victoryScreen").style.display = "flex";
    }

    function emoji(choice){
      if(choice==="rock") return "🪨";
      if(choice==="paper") return "📄";
      return "✂️";
    }

    function sleep(ms){
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function resetGame(){

      playerScore = 0;
      aiScore = 0;
      round = 1;

      document.getElementById("playerScore").textContent = "0";
      document.getElementById("cpuScore").textContent = "0";
      document.getElementById("roundNum").textContent = "1";

      status.innerHTML = "Make your move!";
      document.getElementById("victoryScreen").style.display = "none";

      disableButtons(false);
    }
  </script>

</body>
</html>
