<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧠</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="game-page">

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">
      <img src="images/UsLogo.png" alt="Logo">
    </div>

    <nav>
  <a href="index.html">Home</a>
  <a href="seating.html">Seating</a>
  <a href="menu.html">Menu</a>
  <a href="games.html">Games</a>
</nav>

  </header>

  <img src="images/BreezyUFC.png" class="game-logo">

  <p class="game-quote">
    "Think you can beat me at a game that tests your memory?
    Yeah… I doubt it. I'm basically undefeated—even elephants don't want the smoke."
    <br><br>
    -Breon
  </p>

  <h1>Forever Love Memory Match 💞</h1>

  <div class="status" id="status">
    Moves: 0 / 10
  </div>

  <div class="game-container" id="game">
  12 cards
</div>

  <button class="restart-btn" onclick="restartGame()">
    💘 Restart
  </button>

  <!-- WIN / LOSE SCREEN -->
  <div class="end-screen" id="endScreen">
    <div class="end-box">
      <div class="end-title" id="endTitle"></div>
      <div class="end-message" id="endMessage"></div>
      <button onclick="restartGame()">🔄 Play Again</button>
    </div>
  </div>
<a href="games.html" class="games-home-btn">
  🎮 Back to Games
</a>

  <script>

    
    const emojis = ["💋", "💍", "💌", "💛", "🌹", "💘"];
    let cards = [...emojis, ...emojis];

    let flippedCards = [];
    let matchedCards = [];
    let moves = 0;
    const maxMoves = 10; // 🌟 NEW VALUE

    const gameContainer = document.getElementById("game");
    const statusText = document.getElementById("status");

    const endScreen = document.getElementById("endScreen");
    const endTitle = document.getElementById("endTitle");
    const endMessage = document.getElementById("endMessage");

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function showEndScreen(win) {
      if (win) {
        endTitle.textContent = "💖 You Cheater, I never  lose!";
        endMessage.textContent = `You beat me in ${moves} moves!`;
      } else {
        endTitle.textContent = "🤣 Ha Ha, what a LOSER!";
        endMessage.textContent = `You ran out of moves (${maxMoves}).`;
      }
      endScreen.style.display = "flex";
    }

    function startGame() {
      endScreen.style.display = "none";
      gameContainer.innerHTML = "";
      moves = 0;
      flippedCards = [];
      matchedCards = [];
      updateStatus();
      cards = shuffle([...emojis, ...emojis]);

      cards.forEach((emoji, index) => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.emoji = emoji;
        card.dataset.index = index;
        card.addEventListener("click", flipCard);
        gameContainer.appendChild(card);
      });
    }

    function flipCard() {
      const card = this;
      if (flippedCards.length < 2 && !card.classList.contains("flipped") && !matchedCards.includes(card)) {
        card.classList.add("flipped");
        card.textContent = card.dataset.emoji;
        flippedCards.push(card);

        if (flippedCards.length === 2) {
          moves++;
          updateStatus();
          checkForMatch();
        }
      }
    }

    function checkForMatch() {
      const [first, second] = flippedCards;

      if (first.dataset.emoji === second.dataset.emoji) {
        matchedCards.push(first, second);
        flippedCards = [];

        if (matchedCards.length === cards.length) {
          setTimeout(() => showEndScreen(true), 300);
        }

      } else {
        setTimeout(() => {
          flippedCards.forEach(card => {
            card.classList.remove("flipped");
            card.textContent = "";
          });
          flippedCards = [];
        }, 650);
      }

      if (moves >= maxMoves && matchedCards.length < cards.length) {
        setTimeout(() => showEndScreen(false), 300);
      }
    }

    function updateStatus() {
      statusText.textContent = `Moves: ${moves} / ${maxMoves}`;
    }

    function restartGame() {
      startGame();
    }

    startGame();
  </script>

</body>
</html>
